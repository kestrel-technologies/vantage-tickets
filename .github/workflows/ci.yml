# Checks the queue's own files: issue templates carry the header table, labels parse.
name: ci
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  templates:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Issue templates have the Perch header table
        run: |
          for f in .github/ISSUE_TEMPLATE/*.md; do
            grep -q '| \*\*Status\*\* | \*\*Opened\*\* | \*\*Owner\*\* | \*\*Queue\*\* | \*\*Related\*\* |' "$f" || { echo "::error file=$f::missing Perch header table"; exit 1; }
          done
      - name: Labels parse
        run: python3 -c "import yaml; labels = yaml.safe_load(open('.github/labels.yaml')); assert all({'name','color'} <= set(l) for l in labels); print(len(labels), 'labels')"
